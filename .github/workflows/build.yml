name: Windows Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (defaults to the version in package.json)'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Windows x64
    runs-on: windows-latest

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Determine Release Tag
        id: vars
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $inputTag = ([string]$env:INPUT_TAG).Trim()
          if ($inputTag) {
            $tag = $inputTag
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $pkgVer = (Get-Content package.json | ConvertFrom-Json).version
            $tag = "v$pkgVer"
          }
          git check-ref-format "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Invalid release tag' }
          Write-Host "Resolved release tag: $tag"
          "tag_name=$tag" >> $env:GITHUB_OUTPUT

      - name: Install Dependencies
        run: npm ci

      - name: Build installer for Windows x64
        run: npm run build:installer

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MAGNItola-Windows
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: MAGNItola ${{ steps.vars.outputs.tag_name }}
          files: |
            dist/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
