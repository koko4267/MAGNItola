<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' media: data:; font-src 'self'; connect-src https:; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <title>MAGNItola</title>
    <link rel="icon" type="image/x-icon" href="icon.ico" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app-container">
      <div class="main-pane">
        <!-- URL Input Box -->
        <div class="groupbox">
          <div class="groupbox-title" id="lblUrlPrompt">Paste link:</div>
          <div class="url-bar-row">
            <input
              type="text"
              class="input-text"
              id="inputUrl"
              aria-labelledby="lblUrlPrompt"
              aria-describedby="inputError"
              placeholder="Link to profile, track, playlist, album"
              spellcheck="false"
              autocomplete="off"
            />
            <button class="btn" id="btnPaste">Paste</button>
            <button class="btn btn-primary" id="btnStartDownload">Download</button>
            <button class="btn" id="btnStopDownload" disabled>Stop</button>
          </div>
          <div id="inputError" role="alert" class="field-error"></div>
        </div>

        <!-- Current Download & Queue Box -->
        <div class="groupbox download-panel">
          <div class="groupbox-title" id="lblCurrentStatus">Current download:</div>

          <div class="download-card">
            <div class="album-art-box" id="albumArtBox">
              <img id="albumArtIcon" src="magnitolalogo.jpg" alt="MAGNItola" />
              <img id="albumArtImg" alt="" hidden />
            </div>

            <div class="track-details-col">
              <div>
                <div class="track-title" id="currentTrackTitle">pls faster</div>
                <div class="track-artist" id="currentTrackArtist">MAGNItola</div>
              </div>
              <div>
                <div class="progress-track">
                  <div class="progress-fill" id="trackProgressFill"></div>
                  <div class="progress-text" id="trackProgressText">0%</div>
                </div>
                <div class="download-stats-row">
                  <span id="downloadSizeStats">0.00 / 0.00 MB</span>
                  <span id="downloadSpeedStats">0 KB/s</span>
                  <span id="downloadCounterStats">Track 0 of 0</span>
                </div>
              </div>
              <div class="quote-box" id="quoteDisplay" data-initial-hidden>💬 «God invented computers»</div>
            </div>
          </div>

          <!-- Controls Row (Always under download card) -->
          <div class="bottom-controls-row">
            <a
              href="https://sync-line.pages.dev/"
              target="_blank"
              rel="noopener noreferrer"
              class="syncline-widget"
              title="Visit Syncline (https://sync-line.pages.dev/)"
            >
              <img src="synclinelogo.jpg" alt="Syncline Logo" class="syncline-logo-img" />
              <span class="syncline-text">try syncline</span>
            </a>

            <div class="bottom-right-group">
              <div class="folder-controls">
                <div class="save-path-row" id="saveLocationInfo">
                  <span id="saveFolderLabel">Folder:</span> <span id="saveFolderPath">Downloads</span>
                </div>
                <button class="btn btn-sm" id="btnBrowseFolder" title="Browse...">Browse...</button>
              </div>

              <button
                class="single-lang-btn"
                id="btnToggleLang"
                aria-label="Switch language / Сменить язык"
                title="Switch language / Сменить язык"
              >
                <img class="flag-icon" id="flagImg" src="us.png" alt="Flag" />
                <span id="langLabel">EN</span>
              </button>
            </div>
          </div>

          <!-- Download queue -->
          <div class="queue-box" id="downloadQueueBox" data-initial-hidden>
            <div class="queue-header-row">
              <span id="queueHeaderTitle">Download queue</span>
              <span id="queueHeaderCount">0/0</span>
            </div>
            <div class="queue-list-container" id="queueListContainer"></div>
          </div>
        </div>
      </div>

      <!-- Player Sidebar -->
      <div class="player-sidebar">
        <div class="large-art-container" id="playerLargeArtContainer" data-initial-hidden>
          <div class="large-art-box">
            <img id="playerLargeArtImg" src="" alt="Album Art" class="large-art-img" data-initial-hidden />
            <div id="playerLargeArtPlaceholder" class="large-art-placeholder">
              <span class="large-art-placeholder-icon">♫</span>
              <span class="large-art-placeholder-label" id="playerLargeArtPlaceholderLabel">NO ARTWORK</span>
            </div>
          </div>
          <div class="large-art-details">
            <div class="large-art-title" id="playerLargeArtTitle">-</div>
            <div class="large-art-artist" id="playerLargeArtArtist">-</div>
          </div>
        </div>

        <div class="player-controls-panel">
          <div class="player-buttons-row">
            <div class="playback-btn-group">
              <button
                class="btn playback-btn"
                id="btnPlayerPrev"
                aria-label="Previous track"
                title="Previous track"
                disabled
              >
                |◀
              </button>
              <button
                class="btn btn-primary playback-btn"
                id="btnPlayerPlay"
                aria-label="Play or pause"
                title="Play"
                disabled
              >
                ▶
              </button>
              <button class="btn playback-btn" id="btnPlayerNext" aria-label="Next track" title="Next track" disabled>
                ▶|
              </button>
            </div>
          </div>

          <div class="player-seek-container">
            <div class="seek-bar-track-wrapper" id="playerSeekWrapper">
              <div class="player-seek-fill" id="playerSeekFill"></div>
              <input
                type="range"
                class="player-seek-input"
                id="playerSeekInput"
                aria-label="Playback seek"
                min="0"
                max="1"
                step="0.1"
                value="0"
                disabled
                title="Drag or click to seek"
              />
            </div>
            <div class="seek-time-row">
              <span id="playerCurrentTime">0:00</span>
              <span id="playerTotalTime">0:00</span>
            </div>
          </div>
        </div>

        <!-- Track list -->
        <div class="track-list-container" id="playerTrackList" tabindex="0" role="listbox" aria-label="Library">
          <div class="track-list-empty" id="playerTrackListEmpty">
            <p>No MP3 files found in folder.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Modular Scripts -->
    <script src="js/config.js"></script>
    <script src="js/locales.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/id3.js"></script>
    <script src="js/player.js"></script>
    <script src="js/soundcloud.js"></script>
    <script src="js/download-track.js"></script>
    <script src="js/downloader.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
